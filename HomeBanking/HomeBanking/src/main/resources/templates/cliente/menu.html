<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/57faba85b1.js"crossorigin="anonymous"></script>
	<link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<title>Menu</title>
	
	<style>
		*{
			margin: 0;
			padding: 0;
		}

		header{
			background-image:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(https://infonegocios.info/content/images/2022/07/22/300428/conversions/home4-bnp-edificio--medium-size.jpg);
			height: 100vh;
			background-size: cover;
			background-position: center;
			min-height: 100px;
		}


		.main{
			max-width: 1200px;
			margin: auto;
		}

		.title{
			position: absolute;
			top: 40%;
			left: 50%;
		    transform: translate(-50%,-50%);
		}

		.title h1{
		    font-family:'Times New Roman', Times, serif;
		    font-size: 75px;
		    font-weight: bolder;
			color: #fff;
		}

		.button{
			position: absolute;
			top: 50%;
			left: 50%;
		}

		.btn{
		    border: 2px solid #fff;
		    border-width: medium;
			padding: 5px 10px;
			color: #fff;
			text-decoration: none;
		}
		.btn:hover{
			background-color: #fff;
			color: #000;
		    font-size: 30px;
		}
	</style>
</head>

<body>
	<header>
		<div class="main">
		  <div class="title">
		 	 <h1>HOME BANKING</h1>
	      </div>
		  <div class="button">
		 	  <a th:href="@{/altaCliente}" class="btn">CLIENTE</a>
		 	  <a th:href="@{/}" class="btn">CUENTA</a>
		 	  <a th:href="@{/listaCliente}" class="btn">LISTA CLIENTES</a>
		  </div>
        </div>
	</header>
 
	<script th:src="@{/js/jquery.slim.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
	<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
